name: Build APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Create required .env files
        run: |
          touch .env
          echo 'GEMINI_API_KEY="dummy_key_for_ci_build"' >> .env
          if [ ! -f .env.example ]; then
            touch .env.example
            echo 'GEMINI_API_KEY="dummy_key_for_ci_build"' >> .env.example
          fi

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK and AAB Bundle
        run: |
          ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Copy and rename outputs
        run: |
          mkdir -p build_release
          cp app/build/outputs/apk/debug/*.apk build_release/DocScanner-debug.apk
          cp app/build/outputs/bundle/debug/*.aab build_release/DocScanner-debug.aab
          ls -lh build_release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-APK
          path: build_release/DocScanner-debug.apk
          retention-days: 14

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-AAB
          path: build_release/DocScanner-debug.aab
          retention-days: 14
