name: Build APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Create required .env files
        run: |
          touch .env
          echo 'GEMINI_API_KEY="dummy_key_for_ci_build"' >> .env
          if [ ! -f .env.example ]; then
            touch .env.example
            echo 'GEMINI_API_KEY="dummy_key_for_ci_build"' >> .env.example
          fi

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build Debug APK and Release AAB Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Copy and rename outputs
        run: |
          mkdir -p build_release
          cp app/build/outputs/apk/debug/*.apk build_release/DocScanner-debug.apk
          cp app/build/outputs/bundle/release/*.aab build_release/DocScanner-release.aab
          ls -lh build_release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-APK
          path: build_release/DocScanner-debug.apk
          retention-days: 14

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-AAB
          path: build_release/DocScanner-release.aab
          retention-days: 14
